name: feniksflutter
description: "Feniks Radio mobilna aplikacija."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.3
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/png/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: lib/assets/png/app_icon.png
